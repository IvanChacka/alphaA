<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多因子回测控制台</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#18212f;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1450px;margin:28px auto;padding:0 18px}.sub{color:#697586;margin-bottom:20px}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:20px;margin-bottom:18px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:grid;gap:7px;font-size:13px;color:#586577}input,select,button{font:inherit;border-radius:8px;border:1px solid #ccd4df;padding:10px}button{background:#1769e0;color:#fff;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.5}.status{margin-top:18px}.bar{height:10px;background:#e9eef5;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#1769e0,#29a3ff);transition:.3s}.message{margin-top:8px;color:#536174}.error{color:#b42318}.success{color:#08783e}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.metric{background:#f7f9fc;padding:12px;border-radius:8px}.metric small{display:block;color:#687588}.metric b{font-size:19px}.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.live-head{display:flex;justify-content:space-between;align-items:center}.live-head h2{margin:0 0 14px}.live-value{color:#1769e0;font-size:22px;font-weight:700}.live-table,.table-wrap{overflow:auto;border:1px solid #e4e9f0;border-radius:9px}.live-table{height:470px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px 10px;border-bottom:1px solid #e8edf3;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#eef3f9;z-index:1}.buy{color:#c62828}.sell{color:#08783e}#results{display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{background:#e9eef5;color:#27364a}.tab.active{background:#1769e0;color:#fff}.table-wrap{max-height:600px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px}iframe{width:100%;height:850px;border:0}@media(max-width:850px){.form,.metrics{grid-template-columns:repeat(2,1fr)}.live-grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>多因子回测控制台</h1><div class="sub">回测过程中实时查看交易、收盘持仓与累计收益。</div>
<section class="panel"><form id="form" class="form"><label>股票池<select id="market"><option>A500</option><option>ZZ1000</option><option>ALL_A500</option><option>ALL_ZZ1000</option></select></label><label>开始日期<input id="start" type="date" value="2020-01-01"></label><label>结束日期<input id="end" type="date" value="2024-12-31"></label><label>初始资金<input id="cash" type="number" min="1" step="1" value="100000000"></label><div><button id="run" type="submit">启动回测</button></div></form><div class="status"><div class="bar"><div id="fill" class="fill"></div></div><div id="message" class="message">等待启动</div></div><div id="metrics" class="metrics"></div></section>
<section class="live-grid"><div class="panel"><div class="live-head"><h2>实时交易记录</h2><span id="tradeCount">0 条</span></div><div class="live-table"><table><thead><tr><th>日期</th><th>代码</th><th>方向</th><th>数量</th><th>价格</th><th>费用</th></tr></thead><tbody id="liveTrades"><tr><td colspan="6">等待回测</td></tr></tbody></table></div></div><div class="panel"><div class="live-head"><h2>实时持仓和累计收益</h2><span id="liveReturn" class="live-value">0.00%</span></div><div id="liveAccount" class="sub">总资产：--　交易日：--</div><div class="live-table"><table><thead><tr><th>代码</th><th>数量</th><th>收盘价</th><th>市值</th><th>成本价</th></tr></thead><tbody id="liveHoldings"><tr><td colspan="5">等待回测</td></tr></tbody></table></div></div></section>
<section id="results"><div class="panel"><h2>完整图形报告</h2><iframe id="reportFrame"></iframe></div><div class="panel"><h2>完整后台明细</h2><div class="tabs"><button class="tab active" data-name="account">每日账户</button><button class="tab" data-name="holdings">每日持仓</button><button class="tab" data-name="orders">全部委托</button><button class="tab" data-name="trades">平仓交易</button></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div></div></section>
</main><script>
const $=s=>document.querySelector(s),run=$('#run'),fill=$('#fill'),message=$('#message'),metrics=$('#metrics'),results=$('#results');let current='account',page=1,pages=1,shown=false;
const labels={absolute_annual_return:'绝对年化收益',absolute_sharpe:'绝对夏普',absolute_annual_volatility:'绝对年化波动',absolute_max_drawdown:'绝对最大回撤',excess_annual_return:'超额年化收益',excess_sharpe:'超额夏普',excess_annual_volatility:'超额年化波动',excess_max_drawdown:'超额最大回撤'};
const num=(v,n=2)=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
function live(s){const ts=s.live_trades||[],hs=s.live_holdings||[];$('#tradeCount').textContent=ts.length+' 条（最近500条）';$('#liveTrades').innerHTML=ts.length?ts.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.code}</td><td class="${x.side==='BUY'?'buy':'sell'}">${x.side==='BUY'?'买入':'卖出'}</td><td>${num(x.shares,0)}</td><td>${num(x.price,4)}</td><td>${num(x.fee,2)}</td></tr>`).join(''):'<tr><td colspan="6">当期暂无交易</td></tr>';$('#liveHoldings').innerHTML=hs.length?hs.map(x=>`<tr><td>${x.code}</td><td>${num(x.shares,0)}</td><td>${num(x.close,4)}</td><td>${num(x.market_value,2)}</td><td>${num(x.avg_cost,4)}</td></tr>`).join(''):'<tr><td colspan="5">暂无持仓</td></tr>';const r=Number(s.cumulative_return||0);$('#liveReturn').textContent=(r*100).toFixed(2)+'%';$('#liveReturn').style.color=r<0?'#b42318':'#08783e';$('#liveAccount').textContent=`总资产：${s.total_asset==null?'--':num(s.total_asset,2)}　交易日：${s.current_date||'--'}　持仓：${hs.length}只`}
function show(s){fill.style.width=(s.progress||0)+'%';message.textContent=s.message;message.className='message '+(s.status==='failed'?'error':s.status==='completed'?'success':'');run.disabled=['loading','running'].includes(s.status);live(s);if(s.metrics)metrics.innerHTML=Object.entries(s.metrics).map(([k,v])=>`<div class="metric"><small>${labels[k]||k}</small><b>${k.includes('sharpe')?Number(v).toFixed(3):(Number(v)*100).toFixed(2)+'%'}</b></div>`).join('');if(s.status==='completed'&&!shown){shown=true;results.style.display='block';$('#reportFrame').src='/report/index.html?t='+Date.now();loadTable()}}
async function loadTable(){const d=await fetch(`/api/table?name=${current}&page=${page}&size=50`).then(r=>r.json());pages=d.pages;$('#thead').innerHTML='<tr>'+d.columns.map(c=>`<th>${c}</th>`).join('')+'</tr>';$('#tbody').innerHTML=d.records.map(row=>'<tr>'+d.columns.map(c=>`<td>${row[c]??''}</td>`).join('')+'</tr>').join('');$('#pageInfo').textContent=`第 ${d.page}/${d.pages} 页，共 ${d.total} 条`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.name;page=1;loadTable()});$('#prev').onclick=()=>{if(page>1){page--;loadTable()}};$('#next').onclick=()=>{if(page<pages){page++;loadTable()}};
async function poll(){try{show(await fetch('/api/status',{cache:'no-store'}).then(r=>r.json()))}catch(e){message.textContent='无法连接本地服务'}setTimeout(poll,1000)}
$('#form').onsubmit=async e=>{e.preventDefault();shown=false;results.style.display='none';metrics.innerHTML='';const payload={market:$('#market').value,start:$('#start').value,end:$('#end').value,cash:Number($('#cash').value)};const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){const x=await r.json();message.textContent=x.error}};poll();
</script></body></html>
